<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ephemera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0a0a0c;
      overflow: hidden;
      font-family: 'Cormorant Garamond', serif;
      cursor: none;
    }

    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #cursor {
      position: fixed;
      width: 20px;
      height: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: width 0.3s, height 0.3s, border-color 0.3s;
      z-index: 1000;
    }

    #cursor.active {
      width: 40px;
      height: 40px;
      border-color: rgba(255, 255, 255, 0.6);
    }

    #message {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.4);
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: lowercase;
      z-index: 100;
      transition: opacity 2s;
    }

    #poem {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255, 255, 255, 0);
      font-size: clamp(18px, 3vw, 28px);
      font-weight: 300;
      font-style: italic;
      text-align: center;
      line-height: 2;
      z-index: 100;
      pointer-events: none;
      transition: color 3s;
      max-width: 80%;
    }

    #poem.visible {
      color: rgba(255, 255, 255, 0.7);
    }

    #counter {
      position: fixed;
      top: 40px;
      right: 40px;
      color: rgba(255, 255, 255, 0.2);
      font-size: 12px;
      letter-spacing: 2px;
      z-index: 100;
    }

    .particle-text {
      position: fixed;
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      pointer-events: none;
      z-index: 50;
      animation: float-away 4s ease-out forwards;
    }

    @keyframes float-away {
      0% {
        opacity: 0.8;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-100px) scale(0.5);
      }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="cursor"></div>
  <div id="message">move through the darkness</div>
  <div id="poem"></div>
  <div id="counter"></div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const cursor = document.getElementById('cursor');
    const message = document.getElementById('message');
    const poemEl = document.getElementById('poem');
    const counterEl = document.getElementById('counter');

    let width, height;
    let mouseX = 0, mouseY = 0;
    let particles = [];
    let connections = [];
    let clickCount = 0;
    let totalMoments = 0;

    const fragments = [
      "memory", "breath", "shadow", "echo", "dawn",
      "silence", "wonder", "dream", "dust", "light",
      "hope", "time", "space", "void", "soul",
      "whisper", "moment", "eternity", "presence", "absence",
      "here", "now", "then", "always", "never",
      "beginning", "ending", "between", "within", "beyond"
    ];

    const poems = [
      "what remains<br>when everything<br>has been forgotten",
      "between each breath<br>a universe<br>collapses and begins",
      "we are made<br>of the spaces<br>between stars",
      "time moves through us<br>like light through water<br>leaving nothing unchanged",
      "in the silence<br>between thoughts<br>you are infinite"
    ];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }

    class Particle {
      constructor(x, y, isClick = false) {
        this.x = x;
        this.y = y;
        this.originX = x;
        this.originY = y;
        this.size = isClick ? Math.random() * 4 + 2 : Math.random() * 2 + 0.5;
        this.baseSize = this.size;
        this.vx = (Math.random() - 0.5) * (isClick ? 3 : 0.5);
        this.vy = (Math.random() - 0.5) * (isClick ? 3 : 0.5);
        this.life = isClick ? 200 : Infinity;
        this.maxLife = this.life;
        this.hue = Math.random() * 60 + 200; // blue-purple range
        this.saturation = 30 + Math.random() * 20;
        this.isClick = isClick;
        this.angle = Math.random() * Math.PI * 2;
        this.angleSpeed = (Math.random() - 0.5) * 0.02;
        this.orbitRadius = Math.random() * 50 + 20;
      }

      update() {
        if (this.isClick) {
          this.x += this.vx;
          this.y += this.vy;
          this.vx *= 0.98;
          this.vy *= 0.98;
          this.life--;
          this.size = this.baseSize * (this.life / this.maxLife);
        } else {
          // Gentle orbital movement
          this.angle += this.angleSpeed;
          const targetX = this.originX + Math.cos(this.angle) * this.orbitRadius * 0.3;
          const targetY = this.originY + Math.sin(this.angle) * this.orbitRadius * 0.3;
          this.x += (targetX - this.x) * 0.02;
          this.y += (targetY - this.y) * 0.02;

          // Mouse influence
          const dx = mouseX - this.x;
          const dy = mouseY - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 150) {
            const force = (150 - dist) / 150;
            this.x -= dx * force * 0.02;
            this.y -= dy * force * 0.02;
            this.size = this.baseSize + force * 2;
          } else {
            this.size += (this.baseSize - this.size) * 0.1;
          }
        }
        return this.life > 0;
      }

      draw() {
        const alpha = this.isClick ? (this.life / this.maxLife) * 0.8 : 0.6;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue}, ${this.saturation}%, 70%, ${alpha})`;
        ctx.fill();
      }
    }

    function init() {
      resize();
      // Create initial particle field
      for (let i = 0; i < 100; i++) {
        particles.push(new Particle(
          Math.random() * width,
          Math.random() * height
        ));
      }
    }

    function drawConnections() {
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 100) {
            const alpha = (1 - dist / 100) * 0.15;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = `rgba(180, 180, 220, ${alpha})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }
    }

    function createTextParticle(x, y) {
      const text = document.createElement('div');
      text.className = 'particle-text';
      text.textContent = fragments[Math.floor(Math.random() * fragments.length)];
      text.style.left = x + 'px';
      text.style.top = y + 'px';
      document.body.appendChild(text);
      setTimeout(() => text.remove(), 4000);
    }

    function showPoem() {
      const poem = poems[Math.floor(Math.random() * poems.length)];
      poemEl.innerHTML = poem;
      poemEl.classList.add('visible');
      setTimeout(() => poemEl.classList.remove('visible'), 6000);
    }

    function animate() {
      ctx.fillStyle = 'rgba(10, 10, 12, 0.1)';
      ctx.fillRect(0, 0, width, height);

      drawConnections();

      particles = particles.filter(p => {
        const alive = p.update();
        if (alive) p.draw();
        return alive;
      });

      requestAnimationFrame(animate);
    }

    // Event listeners
    window.addEventListener('resize', resize);

    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      cursor.style.left = mouseX + 'px';
      cursor.style.top = mouseY + 'px';

      // Occasionally spawn text
      if (Math.random() < 0.01) {
        createTextParticle(mouseX + (Math.random() - 0.5) * 100, mouseY + (Math.random() - 0.5) * 100);
      }
    });

    document.addEventListener('mousedown', () => {
      cursor.classList.add('active');
    });

    document.addEventListener('mouseup', () => {
      cursor.classList.remove('active');
    });

    document.addEventListener('click', (e) => {
      clickCount++;
      totalMoments++;
      counterEl.textContent = `moments: ${totalMoments}`;

      // Spawn particles on click
      for (let i = 0; i < 20; i++) {
        particles.push(new Particle(e.clientX, e.clientY, true));
      }

      // Spawn text fragments
      for (let i = 0; i < 3; i++) {
        setTimeout(() => {
          createTextParticle(
            e.clientX + (Math.random() - 0.5) * 150,
            e.clientY + (Math.random() - 0.5) * 150
          );
        }, i * 200);
      }

      // Show poem every 5 clicks
      if (clickCount % 5 === 0) {
        showPoem();
      }

      // Fade hint message
      if (clickCount === 1) {
        message.style.opacity = '0';
      }
    });

    // Touch support
    document.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      mouseX = touch.clientX;
      mouseY = touch.clientY;
      cursor.style.left = mouseX + 'px';
      cursor.style.top = mouseY + 'px';
    }, { passive: false });

    document.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      mouseX = touch.clientX;
      mouseY = touch.clientY;
      cursor.style.left = mouseX + 'px';
      cursor.style.top = mouseY + 'px';
      cursor.classList.add('active');

      // Trigger click effect
      clickCount++;
      totalMoments++;
      counterEl.textContent = `moments: ${totalMoments}`;

      for (let i = 0; i < 20; i++) {
        particles.push(new Particle(mouseX, mouseY, true));
      }

      for (let i = 0; i < 3; i++) {
        setTimeout(() => {
          createTextParticle(
            mouseX + (Math.random() - 0.5) * 150,
            mouseY + (Math.random() - 0.5) * 150
          );
        }, i * 200);
      }

      if (clickCount % 5 === 0) {
        showPoem();
      }

      if (clickCount === 1) {
        message.style.opacity = '0';
      }
    });

    document.addEventListener('touchend', () => {
      cursor.classList.remove('active');
    });

    init();
    animate();
  </script>
</body>
</html>
